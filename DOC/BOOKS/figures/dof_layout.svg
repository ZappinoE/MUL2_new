<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><text x="360.0" y="22.0" font-size="12" text-anchor="middle" fill="#1d4f91" font-weight="bold">Field-major numbering: all U terms, then all V terms, then all W terms</text><rect x="40.0" y="50.0" width="190.0" height="36.0" rx="2" fill="#dbe7f6" stroke="#1d4f91" stroke-width="1.2"/><text x="135.0" y="40.0" font-size="11" text-anchor="middle" fill="#1d4f91" font-weight="bold">field U (1)</text><line x1="40.0" y1="50.0" x2="40.0" y2="86.0" stroke="#1d4f91" stroke-width="1"/><text x="71.7" y="72.0" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">node 1</text><line x1="103.3" y1="50.0" x2="103.3" y2="86.0" stroke="#1d4f91" stroke-width="1"/><text x="135.0" y="72.0" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">node 2</text><line x1="166.7" y1="50.0" x2="166.7" y2="86.0" stroke="#1d4f91" stroke-width="1"/><text x="198.3" y="72.0" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">node 3</text><text x="135.0" y="104.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">node-major, then term</text><rect x="255.0" y="50.0" width="190.0" height="36.0" rx="2" fill="#dff1e5" stroke="#1d4f91" stroke-width="1.2"/><text x="350.0" y="40.0" font-size="11" text-anchor="middle" fill="#1d4f91" font-weight="bold">field V (2)</text><line x1="255.0" y1="50.0" x2="255.0" y2="86.0" stroke="#1d4f91" stroke-width="1"/><text x="286.7" y="72.0" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">node 1</text><line x1="318.3" y1="50.0" x2="318.3" y2="86.0" stroke="#1d4f91" stroke-width="1"/><text x="350.0" y="72.0" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">node 2</text><line x1="381.7" y1="50.0" x2="381.7" y2="86.0" stroke="#1d4f91" stroke-width="1"/><text x="413.3" y="72.0" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">node 3</text><text x="350.0" y="104.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">node-major, then term</text><rect x="470.0" y="50.0" width="190.0" height="36.0" rx="2" fill="#fbe5dc" stroke="#1d4f91" stroke-width="1.2"/><text x="565.0" y="40.0" font-size="11" text-anchor="middle" fill="#1d4f91" font-weight="bold">field W (3)</text><line x1="470.0" y1="50.0" x2="470.0" y2="86.0" stroke="#1d4f91" stroke-width="1"/><text x="501.7" y="72.0" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">node 1</text><line x1="533.3" y1="50.0" x2="533.3" y2="86.0" stroke="#1d4f91" stroke-width="1"/><text x="565.0" y="72.0" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">node 2</text><line x1="596.7" y1="50.0" x2="596.7" y2="86.0" stroke="#1d4f91" stroke-width="1"/><text x="628.3" y="72.0" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">node 3</text><text x="565.0" y="104.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">node-major, then term</text><text x="360.0" y="150.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">global DOF = FIRST(node, field) + term − 1</text><text x="360.0" y="175.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">TERM_COUNT(node, field): TE order N → (N+1)(N+2)/2 (beam), N+1 (plate), 1 (solid)</text><text x="360.0" y="193.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">LE → number of nodes of the expansion mesh</text><text x="360.0" y="225.0" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Example: 3 nodes, TE1 beam (3 terms): 9 DOF per field, 27 DOF in total</text></svg>