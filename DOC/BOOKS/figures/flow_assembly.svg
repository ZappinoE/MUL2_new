<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect x="120.0" y="10.0" width="260.0" height="36.0" rx="5" fill="#dbe7f6" stroke="#1d4f91" stroke-width="1.2"/><text x="250.0" y="31.9" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">ASSEMBLE_MODEL_SYSTEM(MODEL, CACHE)</text><rect x="120.0" y="66.0" width="260.0" height="46.0" rx="5" fill="#dff1e5" stroke="#2f8f4e" stroke-width="1.2"/><text x="250.0" y="86.2" font-size="10.5" text-anchor="middle" fill="#12355f" font-weight="normal">for each element: BUILD_ELEMENT_DOF_LIST</text><text x="250.0" y="99.3" font-size="10.5" text-anchor="middle" fill="#12355f" font-weight="normal">+ MARK_LAGRANGE_DOFS → DOF_LIST_TYPE</text><rect x="120.0" y="132.0" width="260.0" height="46.0" rx="5" fill="#dff1e5" stroke="#2f8f4e" stroke-width="1.2"/><text x="250.0" y="152.2" font-size="10.5" text-anchor="middle" fill="#12355f" font-weight="normal">BUILD_COUPLING_TABLES (per expansion mesh)</text><text x="250.0" y="165.3" font-size="10.5" text-anchor="middle" fill="#12355f" font-weight="normal">BUILD_PATTERN_FROM_DOF_LISTS → CSR</text><rect x="120.0" y="198.0" width="260.0" height="46.0" rx="5" fill="#fbf1cc" stroke="#8a6d12" stroke-width="1.2"/><text x="250.0" y="218.2" font-size="10.5" text-anchor="middle" fill="#12355f" font-weight="normal">CHUNK_SIZE: multiple of the thread count,</text><text x="250.0" y="231.3" font-size="10.5" text-anchor="middle" fill="#12355f" font-weight="normal">memory budget CHUNK_BYTES = 1e9</text><line x1="250.0" y1="46.0" x2="250.0" y2="66.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><line x1="250.0" y1="112.0" x2="250.0" y2="132.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><line x1="250.0" y1="178.0" x2="250.0" y2="198.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><polygon points="250.0,264.0 365.0,296.0 250.0,328.0 135.0,296.0" fill="#fbf1cc" stroke="#8a6d12" stroke-width="1.2"/><text x="250.0" y="299.5" font-size="10" text-anchor="middle" fill="#4a3a05" font-weight="normal">more elements?</text><line x1="250.0" y1="244.0" x2="250.0" y2="264.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><rect x="115.0" y="346.0" width="270.0" height="52.0" rx="5" fill="#fbe5dc" stroke="#b9461b" stroke-width="1.2"/><text x="250.0" y="369.2" font-size="10.5" text-anchor="middle" fill="#12355f" font-weight="normal">!$OMP PARALLEL DO (dynamic)</text><text x="250.0" y="382.3" font-size="10.5" text-anchor="middle" fill="#12355f" font-weight="normal">EVALUATE_ELEMENT → K_e, M_e of the chunk</text><line x1="250.0" y1="328.0" x2="250.0" y2="346.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><text x="268.0" y="340.0" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">yes</text><rect x="115.0" y="418.0" width="270.0" height="52.0" rx="5" fill="#fbe5dc" stroke="#b9461b" stroke-width="1.2"/><text x="250.0" y="441.2" font-size="10.5" text-anchor="middle" fill="#12355f" font-weight="normal">serial loop in element order:</text><text x="250.0" y="454.3" font-size="10.5" text-anchor="middle" fill="#12355f" font-weight="normal">SCATTER_ELEMENT into CSR (deterministic)</text><line x1="250.0" y1="398.0" x2="250.0" y2="418.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><path d="M 385.0,444.0 L 440.0,444.0 L 440.0,296.0 L 365.0,296.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><line x1="250.0" y1="470.0" x2="250.0" y2="500.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><rect x="120.0" y="500.0" width="260.0" height="38.0" rx="5" fill="#dbe7f6" stroke="#1d4f91" stroke-width="1.2"/><text x="250.0" y="522.9" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">K (and M) in SPARSE_SYSTEM_TYPE</text><text x="455.0" y="316.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">no</text><text x="500.0" y="120.0" font-size="11.5" text-anchor="start" fill="#1d4f91" font-weight="bold">Why a serial scatter?</text><text x="500.0" y="140.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">Floating-point sums are not</text><text x="500.0" y="157.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">associative. Scattering the chunk</text><text x="500.0" y="174.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">in element order fixes the order</text><text x="500.0" y="191.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">of every addition: the result is</text><text x="500.0" y="208.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">bit-identical for any thread</text><text x="500.0" y="225.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">count (tested with 1 and 4).</text></svg>