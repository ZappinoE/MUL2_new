<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect x="80.0" y="8.0" width="300.0" height="34.0" rx="5" fill="#dbe7f6" stroke="#1d4f91" stroke-width="1.2"/><text x="230.0" y="28.9" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">BUILD_LINEAR_ELEMENT_MATRICES</text><rect x="80.0" y="62.0" width="300.0" height="34.0" rx="5" fill="#dff1e5" stroke="#2f8f4e" stroke-width="1.2"/><text x="230.0" y="82.7" font-size="10.5" text-anchor="middle" fill="#12355f" font-weight="normal">validate, DOF list, allocate K_e (and M_e)</text><polygon points="230.0,120.0 380.0,150.0 230.0,180.0 80.0,150.0" fill="#fbf1cc" stroke="#8a6d12" stroke-width="1.2"/><text x="230.0" y="153.5" font-size="10" text-anchor="middle" fill="#4a3a05" font-weight="normal">FORCE_GENERAL?  (MUL2_GENERAL_KERNEL=1)</text><line x1="230.0" y1="42.0" x2="230.0" y2="62.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><line x1="230.0" y1="96.0" x2="230.0" y2="120.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><rect x="70.0" y="202.0" width="320.0" height="70.0" rx="5" fill="#dff1e5" stroke="#2f8f4e" stroke-width="1.2"/><text x="230.0" y="221.9" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">BUILD_SEPARABLE_MATRICES</text><text x="230.0" y="234.4" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">Sigma, Sm (structural)   Eps, Em (expansion)</text><text x="230.0" y="246.9" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">Gamma = W^T C W    Lambda = Gamma · Sm</text><text x="230.0" y="259.4" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">K_block = sum Lambda · Em</text><line x1="230.0" y1="180.0" x2="230.0" y2="202.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><text x="244.0" y="196.0" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">no</text><polygon points="230.0,300.0 345.0,326.0 230.0,352.0 115.0,326.0" fill="#fbf1cc" stroke="#8a6d12" stroke-width="1.2"/><text x="230.0" y="329.5" font-size="10" text-anchor="middle" fill="#4a3a05" font-weight="normal">APPLICABLE?</text><line x1="230.0" y1="272.0" x2="230.0" y2="300.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><rect x="70.0" y="370.0" width="320.0" height="80.0" rx="5" fill="#fbe5dc" stroke="#b9461b" stroke-width="1.2"/><text x="230.0" y="394.9" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">point-by-point kernel (reference)</text><text x="230.0" y="407.4" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">batches of ≤ 128 Gauss points:</text><text x="230.0" y="419.9" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">B_P, C B_P → ACCUMULATE_UPPER_PRODUCT</text><text x="230.0" y="432.4" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">mass: ADD_MASS per displacement component</text><line x1="230.0" y1="352.0" x2="230.0" y2="370.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><text x="244.0" y="366.0" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">no</text><rect x="100.0" y="480.0" width="260.0" height="36.0" rx="5" fill="#dbe7f6" stroke="#1d4f91" stroke-width="1.2"/><text x="230.0" y="501.9" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">MIRROR_UPPER_TRIANGLE  →  K_e, M_e</text><line x1="230.0" y1="450.0" x2="230.0" y2="480.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><path d="M 115.0,326.0 L 24.0,326.0 L 24.0,498.0 L 100.0,498.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><text x="40.0" y="318.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="normal">yes</text><text x="500.0" y="130.0" font-size="11.5" text-anchor="start" fill="#1d4f91" font-weight="bold">Applicable when</text><text x="500.0" y="152.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">• C constant in each sub-element</text><text x="500.0" y="169.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">• layout: sub-element → p → q</text><text x="500.0" y="186.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">• DOF terms numbered 1..T</text><text x="500.0" y="203.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">(always true for the supported</text><text x="500.0" y="220.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">inputs)</text><text x="500.0" y="237.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal"></text><text x="500.0" y="254.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">Both kernels give the same</text><text x="500.0" y="271.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">matrices to round-off (1e-15,</text><text x="500.0" y="288.0" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">checked on dumped K and M).</text></svg>