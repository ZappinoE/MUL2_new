5dc" stroke="#b9461b" stroke-width="0.8"/><rect x="632.0" y="82.0" width="34.0" height="12.0" rx="1" fill="#fbe5dc" stroke="#b9461b" stroke-width="0.8"/><rect x="670.0" y="82.0" width="34.0" height="12.0" rx="1" fill="#fbe5dc" stroke="#b9461b" stroke-width="0.8"/><text x="630.0" y="112.0" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">expansion points q = 1 … Q_e</text><text x="360.0" y="150.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">point(e, p, q) = FIRST + Σ_{e' &lt; e} P·Q_e' + (p − 1)·Q_e + (q − 1)</text><text x="360.0" y="180.0" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">STRUCTURAL_RULE_INDEX / STRUCTURAL_POINT_INDEX → reference rule and point p</text><text x="360.0" y="198.0" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">EXPANSION_ELEMENT_INDEX / EXPANSION_RULE_INDEX / EXPANSION_POINT_INDEX → sub-element e and point q</text><text x="360.0" y="216.0" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">REFERENCE_WEIGHT = w_p · w_q ;  INTEGRATION_WEIGHT also contains det J_p · det J_q</text></svg>