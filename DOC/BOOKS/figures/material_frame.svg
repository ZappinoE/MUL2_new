<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><line x1="70.0" y1="170.0" x2="310.0" y2="170.0" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/><line x1="180.0" y1="270.0" x2="180.0" y2="50.0" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/><text x="322.0" y="174.0" font-size="11" text-anchor="start" fill="#555" font-weight="normal">x (element)</text><text x="188.0" y="44.0" font-size="11" text-anchor="start" fill="#555" font-weight="normal">y (element)</text><line x1="180.0" y1="170.0" x2="283.9" y2="110.0" stroke="#b9461b" stroke-width="2.2" marker-end="url(#arr)"/><text x="291.9" y="110.0" font-size="11" text-anchor="start" fill="#b9461b" font-weight="bold">T  (material)</text><line x1="180.0" y1="170.0" x2="120.0" y2="66.1" stroke="#2f8f4e" stroke-width="2.2" marker-end="url(#arr)"/><text x="114.0" y="60.1" font-size="11" text-anchor="end" fill="#2f8f4e" font-weight="bold">L  (fibre)</text><path d="M 240.0 170.0 A 60 60 0 0 0 232.0 140.0" fill="none" stroke="#555" stroke-width="1.2"/><text x="258.0" y="156.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">θz</text><text x="480.0" y="70.0" font-size="12.5" text-anchor="start" fill="#1d4f91" font-weight="bold">Material axes (T, L, Z)</text><text x="480.0" y="100.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">LAMINATION.dat gives two angles per lamination:</text><text x="480.0" y="120.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">ANGLE_Y: rotation about the element y axis</text><text x="480.0" y="140.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">ANGLE_Z: rotation about the element z axis</text><text x="480.0" y="160.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">A = Rz(θz) · Ry(θy) maps element-frame components</text><text x="480.0" y="180.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">to material-frame components.</text><text x="480.0" y="200.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">With θy = 0 and θz = 0 the material axes</text><text x="480.0" y="220.0" font-size="11" text-anchor="start" fill="#222" font-weight="normal">T, L, Z coincide with the element x, y, z.</text></svg>