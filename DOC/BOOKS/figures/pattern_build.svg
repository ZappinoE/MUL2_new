<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><text x="360.0" y="20.0" font-size="12" text-anchor="middle" fill="#1d4f91" font-weight="bold">CSR pattern from DOF lists (two passes, no dense matrix)</text><rect x="30.0" y="40.0" width="200.0" height="60.0" rx="5" fill="#dff1e5" stroke="#2f8f4e" stroke-width="1.2"/><text x="130.0" y="67.3" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">DOF → elements table</text><text x="130.0" y="79.8" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">FIRST(dof), MEMBER, MEMBER_LOCAL</text><rect x="260.0" y="40.0" width="200.0" height="60.0" rx="5" fill="#fbf1cc" stroke="#8a6d12" stroke-width="1.2"/><text x="360.0" y="67.3" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">pass 1: for each row, mark unique</text><text x="360.0" y="79.8" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">columns (MARK array) → counts</text><rect x="490.0" y="40.0" width="200.0" height="60.0" rx="5" fill="#fbf1cc" stroke="#8a6d12" stroke-width="1.2"/><text x="590.0" y="67.3" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">prefix sum → ROW_POINTER</text><text x="590.0" y="79.8" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">allocate COLUMN_INDEX</text><line x1="230.0" y1="70.0" x2="260.0" y2="70.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><line x1="460.0" y1="70.0" x2="490.0" y2="70.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><rect x="260.0" y="130.0" width="200.0" height="60.0" rx="5" fill="#fbe5dc" stroke="#b9461b" stroke-width="1.2"/><text x="360.0" y="157.3" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">pass 2: store the columns,</text><text x="360.0" y="169.8" font-size="10" text-anchor="middle" fill="#12355f" font-weight="normal">SORT_SEGMENT each row</text><line x1="590.0" y1="100.0" x2="460.0" y2="160.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><polygon points="360.0,210.0 500.0,235.0 360.0,260.0 220.0,235.0" fill="#fbf1cc" stroke="#8a6d12" stroke-width="1.2"/><text x="360.0" y="232.3" font-size="10" text-anchor="middle" fill="#4a3a05" font-weight="normal">pair (I,J) of an element coupled?</text><text x="360.0" y="244.8" font-size="10" text-anchor="middle" fill="#4a3a05" font-weight="normal">ARE_COUPLED(table, term_I, term_J)</text><text x="600.0" y="150.0" font-size="10" text-anchor="start" fill="#222" font-weight="normal">Lagrange expansion: terms that do not</text><text x="600.0" y="162.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">share a sub-element give exact zeros</text><text x="600.0" y="175.0" font-size="10" text-anchor="start" fill="#222" font-weight="normal">and are left out (6× fewer entries).</text><line x1="360.0" y1="190.0" x2="360.0" y2="210.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/></svg>