<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><text x="360.0" y="22.0" font-size="12.5" text-anchor="middle" fill="#1d4f91" font-weight="bold">Separable kernel: cost adds instead of multiplying</text><rect x="30.0" y="50.0" width="300.0" height="120.0" rx="5" fill="#fbe5dc" stroke="#b9461b" stroke-width="1.2"/><text x="180.0" y="86.6" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">POINT-BY-POINT</text><text x="180.0" y="100.3" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">for each of P·Q combined points</text><text x="180.0" y="114.1" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">  for each DOF pair (n² / 2)</text><text x="180.0" y="127.8" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">    B_i^T C B_j</text><text x="180.0" y="141.6" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">cost ≈ P · Q · n²</text><rect x="390.0" y="50.0" width="300.0" height="120.0" rx="5" fill="#dff1e5" stroke="#2f8f4e" stroke-width="1.2"/><text x="540.0" y="86.6" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">SEPARABLE</text><text x="540.0" y="100.3" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">structural: Sm(i,j) = Σ_p w σ σ   (P·N²)</text><text x="540.0" y="114.1" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">expansion:  Em(t,s) = Σ_q w ε ε   (Q·T²)</text><text x="540.0" y="127.8" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">combine:  K = Σ Λ · Em           (n²·#e·9)</text><text x="540.0" y="141.6" font-size="11" text-anchor="middle" fill="#12355f" font-weight="normal">cost ≈ P·N² + Q·T² + n²</text><text x="360.0" y="215.0" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">Example: beam B4 (N = 4), Taylor order 15 (T = 136, n = 544·3 = 1632), P = 4, Q = 256 per sub-element</text><text x="360.0" y="238.0" font-size="10.5" text-anchor="middle" fill="#b9461b" font-weight="normal">point-by-point ≈ 4 · 256 · 1632² / 2 ≈ 1.4·10⁹ nucleus evaluations per element</text><text x="360.0" y="258.0" font-size="10.5" text-anchor="middle" fill="#2f8f4e" font-weight="normal">separable ≈ 9·(4·16 + 256·136² + 1632²/2) ≈ 5·10⁷ products per element</text><text x="360.0" y="300.0" font-size="11.5" text-anchor="middle" fill="#111" font-weight="bold">Measured (100 776 DOF, Taylor 15): assembly 526 s → 12 s</text></svg>